<style>
  :root {
    --ink: #4a1a2c;
    --rose: #c9184a;
    --paper: #fffaf3;
    --glass: rgba(255, 255, 255, .12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    overflow: hidden; background: #02030c; color: #fff;
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 2.5s ease; }
  canvas#scene.ready { opacity: 1; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, .55)); }
  .nogl { position: fixed; inset: 0; display: none; background: linear-gradient(#02030c, #0a1a3a 60%, #0d2a22); }
  body.no-webgl .nogl { display: block; }

  /* ---------- open button ---------- */
  .open-btn {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: .6em;
    padding: .85em 1.7em; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .28);
    background: var(--glass); color: #fff; backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    font: italic 500 clamp(1.05rem, 3.8vw, 1.3rem) "Cormorant Garamond", Georgia, serif; letter-spacing: .02em;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .25);
    opacity: 0; animation: btnIn 1.2s ease 2.2s forwards;
    transition: background .3s, transform .3s;
  }
  .open-btn::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; z-index: -1;
    box-shadow: 0 0 24px rgba(255, 120, 170, .45); animation: pulse 2.6s ease-in-out infinite;
  }
  .open-btn:hover { background: rgba(255, 255, 255, .2); }
  .open-btn:active { transform: translateX(-50%) scale(.97); }
  .open-btn:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .open-btn svg { width: 1.1em; height: 1.1em; }
  @keyframes btnIn { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* ---------- envelope + letter ---------- */
  .modal {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(2, 4, 16, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    visibility: hidden; opacity: 0; transition: opacity .5s, visibility 0s .5s;
  }
  .modal.open { visibility: visible; opacity: 1; transition: opacity .5s; }

  .env {
    position: absolute; width: min(340px, calc(100% - 64px)); aspect-ratio: 1.55;
    perspective: 900px; transition: transform .7s cubic-bezier(.5, 0, .7, .4), opacity .5s;
  }
  .modal.open .env { transform: translateY(60vh) rotate(6deg); opacity: 0; transition-delay: 1.15s, 1.35s; }
  .env-body {
    position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(160deg, #fbeee4, #f1d9cb);
    box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
  }
  .env-body::after { /* folded front */
    content: ""; position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(200deg, #f6e2d6, #e9cbb9);
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: linear-gradient(180deg, #f3d9c9, #e7c3ae);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: 50% 0; transition: transform .6s ease; z-index: 2;
  }
  .modal.open .env-flap { transform: rotateX(180deg); transition-delay: .25s; z-index: 0; }
  .seal {
    position: absolute; left: 50%; top: 58%; width: 54px; height: 54px; translate: -50% -50%; z-index: 3;
    border-radius: 50%; display: grid; place-items: center; color: #ffd6df; font-size: 22px;
    background: radial-gradient(circle at 35% 30%, #e0405f, #9d0f2e 70%);
    box-shadow: 0 3px 8px rgba(0, 0, 0, .35), inset 0 0 0 4px rgba(255, 255, 255, .12);
    transition: opacity .3s;
  }
  .modal.open .seal { opacity: 0; transition-delay: .1s; }

  .paper {
    position: relative; width: min(540px, calc(100% - 32px)); max-height: min(86vh, 860px); overflow: auto;
    padding: clamp(2.2rem, 6vw, 3.2rem) clamp(1.5rem, 6vw, 3rem) clamp(1.8rem, 5vw, 2.6rem);
    border-radius: 4px; color: var(--ink);
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(255, 200, 210, .35), transparent 50%),
      radial-gradient(120% 80% at 100% 100%, rgba(255, 210, 190, .35), transparent 50%),
      var(--paper);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(160, 60, 90, .12);
    opacity: 0; transform: translateY(40px) scale(.7);
    transition: opacity .4s, transform .4s;
  }
  .modal.open .paper {
    opacity: 1; transform: none;
    transition: opacity .8s ease 1.1s, transform 1.1s cubic-bezier(.16, 1, .3, 1) 1.1s;
  }
  .paper::before { /* inner frame */
    content: ""; position: absolute; inset: 10px; border: 1px solid rgba(201, 24, 74, .22); border-radius: 2px; pointer-events: none;
  }
  .paper h2 {
    font: 400 clamp(2.2rem, 8vw, 3rem)/1.1 "Great Vibes", cursive; color: var(--rose); margin-bottom: .55em;
  }
  .paper p {
    font-style: italic; font-size: clamp(1.15rem, 4.3vw, 1.4rem); line-height: 1.65;
  }
  .paper p + p { margin-top: .55em; }
  .paper .sign { font: 400 clamp(1.7rem, 6vw, 2.2rem)/1.2 "Great Vibes", cursive; color: var(--rose); text-align: right; margin-top: 1em; }
  .paper .reveal { opacity: 0; transform: translateY(8px); filter: blur(4px); }
  .modal.open .paper .reveal {
    opacity: 1; transform: none; filter: none;
    transition: opacity 1s ease, transform 1s ease, filter 1s ease;
    transition-delay: calc(1.7s + var(--i) * .55s);
  }
  .divider { display: block; width: 64px; height: 12px; margin: 1.2em auto 0; color: var(--rose); opacity: .6; }
  .close {
    position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; z-index: 1;
    display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent;
    color: var(--ink); cursor: pointer; transition: background .2s;
  }
  .close:hover { background: rgba(201, 24, 74, .08); }
  .close:focus-visible { outline: 2px solid var(--rose); }
  .close svg { width: 20px; height: 20px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; transition-delay: 0s !important; }
  }
</style>

<script>
  // letter (works even without WebGL)
  const letter = document.getElementById('letter');
  const openBtn = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const setOpen = (open) => { letter.classList.toggle('open', open); (open ? closeBtn : openBtn).focus({ preventScroll: true }); };
  openBtn.onclick = () => setOpen(true);
  closeBtn.onclick = () => setOpen(false);
  letter.onclick = (e) => { if (e.target === letter) setOpen(false); };
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && letter.classList.contains('open')) setOpen(false); });
</script>

  { "imports": {

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.body.classList.add('no-webgl');
  throw e;
}
const DPR = Math.min(devicePixelRatio, 1.75);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1730, 0.028);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 1200);
const lookTarget = new THREE.Vector3(0, 2.6, -14);
const camBase = new THREE.Vector3(0, 1.2, 6.4);
camera.layers.enable(1); // layer 1 = meadow plants, hidden from the lake reflection to save GPU
const MILKY = new THREE.Vector3(0.62, 0.32, 0.72).normalize(); // normal of the milky-way plane

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const uTime = { value: 0 };
const dummy = new THREE.Object3D();

/* ---------- shared GLSL noise ---------- */
const NOISE = /* glsl */`
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
  }
  float fbm(vec2 p){ float v = 0.0, a = 0.5; for(int i=0;i<5;i++){ v += a*noise(p); p *= 2.03; a *= 0.5; } return v; }
`;

/* ---------- sky dome ---------- */
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uN: { value: MILKY } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: NOISE + `varying vec3 vDir; uniform vec3 uN;
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y, -0.2, 1.0);
        vec3 top = vec3(0.004, 0.006, 0.025), mid = vec3(0.012, 0.03, 0.09), hor = vec3(0.04, 0.10, 0.17);
        vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, h)); c = mix(c, top, smoothstep(0.18, 0.7, h));
        c += vec3(0.0, 0.06, 0.04) * exp(-abs(h) * 14.0); // faint green airglow at horizon
        // milky way: soft dusty band with dark lanes
        float band = exp(-pow(dot(d, uN) / 0.16, 2.0));
        float dust = fbm(d.xz * 6.0 + d.y * 3.0);
        float lanes = smoothstep(0.45, 0.75, fbm(d.xy * 11.0 + 7.0));
        c += band * (0.6 + dust) * (1.0 - 0.6 * lanes) * vec3(0.05, 0.04, 0.09) * smoothstep(0.0, 0.15, h);
        gl_FragColor = vec4(c, 1.0);
      }`
  })
));

/* ---------- stars ---------- */
{
  const N = 9000, pos = new Float32Array(N * 3), size = new Float32Array(N), phase = new Float32Array(N);
  const d = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    do {
      d.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize();
      if (i % 2) d.addScaledVector(MILKY, -d.dot(MILKY) * rand(0.75, 1)).normalize(); // half the stars crowd the milky way
    } while (d.y < 0.02);
    pos.set([d.x * 550, d.y * 550, d.z * 550], i * 3);
    size[i] = Math.pow(Math.random(), 7) * 3.4 + 0.5; phase[i] = Math.random() * 6.28;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('size', new THREE.BufferAttribute(size, 1));
  g.setAttribute('phase', new THREE.BufferAttribute(phase, 1));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime, uPR: { value: DPR } },
    vertexShader: `attribute float size; attribute float phase; uniform float uTime, uPR; varying float vA;
      void main(){ vA = 0.55 + 0.45 * sin(uTime * (0.8 + phase * 0.3) + phase);
        gl_PointSize = size * uPR; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vec3(0.85, 0.9, 1.0) * a * vA * 1.4, 1.0); }`
  })));
}

/* ---------- moon ---------- */
{
  const moon = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 16), new THREE.MeshBasicMaterial({ color: 0xfff2d0, fog: false }));
  moon.position.set(120, 120, -330);
  scene.add(moon);
}

/* ---------- aurora curtains ---------- */
function aurora({ z, y, w, h, x = 0, rot = 0, tilt = 0, colA, colB, colC, hem = 0xff2f8e, k = 1, speed = 1, soft = 0.06 }) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h, 320, 1),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
      uniforms: { uTime, uA: { value: new THREE.Color(colA) }, uB: { value: new THREE.Color(colB) }, uC: { value: new THREE.Color(colC) }, uH: { value: new THREE.Color(hem) }, uK: { value: k }, uS: { value: speed }, uSoft: { value: soft } },
      vertexShader: `uniform float uTime, uS; varying vec2 vUv;
        void main(){ vUv = uv; vec3 p = position; float t = uTime * uS;
          p.z += sin(p.x * 0.012 + t * 0.12) * 40.0 + sin(p.x * 0.031 - t * 0.09) * 14.0;
          p.x += sin(p.y * 0.02 + t * 0.15) * 6.0;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
      fragmentShader: NOISE + `uniform float uTime, uK, uS, uSoft; uniform vec3 uA, uB, uC, uH; varying vec2 vUv;
        void main(){
          float t = uTime * uS, x = vUv.x, y = vUv.y;
          float rays = fbm(vec2(x * 90.0 + t * 0.25, y * 0.8 - t * 0.08));
          rays = pow(rays, 3.2) * 4.5;
          float folds = fbm(vec2(x * 7.0 - t * 0.06, t * 0.04 + 3.1));
          folds = smoothstep(0.38, 0.78, folds);
          float base = smoothstep(0.0, uSoft, y);
          float top = 1.0 - smoothstep(0.2, 1.0, y);
          float edges = smoothstep(0.0, 0.18, x) * smoothstep(1.0, 0.82, x);
          vec3 col = mix(uA, uB, smoothstep(0.08, 0.5, y));
          col = mix(col, uC, smoothstep(0.45, 0.95, y));
          float a = rays * folds * base * top * edges;
          col = mix(col, vec3(0.85, 1.0, 0.92), smoothstep(0.9, 2.2, a) * 0.6); // white-hot cores
          float hemA = exp(-y * 28.0) * folds * edges * base * step(uSoft, 0.1);
          vec3 outc = col * a + mix(uH, uA, 0.35) * hemA * 1.4; // magenta lower fringe
          gl_FragColor = vec4(outc * uK, 1.0);
        }`
    })
  );
  m.position.set(x, y + h / 2, z); m.rotation.set(tilt, rot, 0, 'YXZ');
  scene.add(m);
}
aurora({ z: -220, y: 14, w: 760, h: 190, colA: 0x2bff9e, colB: 0x19e3a0, colC: 0x8a4dff, k: 0.8 });
aurora({ z: -300, y: 40, w: 900, h: 220, x: 80, rot: 0.15, colA: 0x38ffb0, colB: 0x22b8ff, colC: 0xff4fc3, k: 0.5, speed: 0.8 });
aurora({ z: -170, y: 26, w: 520, h: 150, x: -120, rot: -0.35, colA: 0x5dff8a, colB: 0x2be0c8, colC: 0xb25cff, k: 0.4, speed: 1.2 });
// the big swirl that sweeps overhead toward the viewer
aurora({ z: -130, y: 45, w: 420, h: 150, x: 30, rot: 0.25, tilt: -0.85, colA: 0x3dffa8, colB: 0x2df5c0, colC: 0xc06bff, k: 0.45, speed: 0.9, soft: 0.35 });

/* ---------- mountains ---------- */
function ridge(z, height, color, seed) {
  const g = new THREE.PlaneGeometry(1400, 1, 400, 1), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i);
    if (p.getY(i) > 0) {
      const r = Math.abs(Math.sin(x * 0.006 + seed)) * 0.55 + Math.sin(x * 0.017 + seed * 2) * 0.25 + Math.sin(x * 0.051 + seed) * 0.08 + 0.3;
      p.setY(i, r * height);
    } else p.setY(i, -10);
  }
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, fog: false }));
  m.position.z = z; scene.add(m);
}
ridge(-420, 70, 0x050c1a, 1.3);
ridge(-270, 16, 0x030810, 4.1);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x5b7dff, 0x0b2216, 0.9));
const auroraLight = new THREE.DirectionalLight(0x6dffc8, 3.0); auroraLight.position.set(0, 25, -40); scene.add(auroraLight);
const moonLight = new THREE.DirectionalLight(0xa9bcff, 1.4); moonLight.position.set(-12, 7, 3); scene.add(moonLight); // side light to model the fur
const warm = new THREE.PointLight(0xffc48a, 7, 7, 1.5); warm.position.set(-0.8, 1.8, 5.6); scene.add(warm); // warm fill so gold fur & white fur read true

/* ---------- ground ---------- */
{
  const g = new THREE.PlaneGeometry(900, 900, 1, 1); g.rotateX(-Math.PI / 2);
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x0c2418, roughness: 1 })));
}

/* ---------- mirror lake ---------- */
{
  const lake = new Reflector(new THREE.PlaneGeometry(1400, 230), {
    clipBias: 0.003, color: 0x8796a6,
    textureWidth: Math.round(innerWidth * DPR * 0.6), textureHeight: Math.round(innerHeight * DPR * 0.6)
  });
  lake.rotation.x = -Math.PI / 2; lake.position.set(0, 0.03, -10 - 115);
  scene.add(lake);
}

/* ---------- pine silhouettes ---------- */
{
  const parts = [new THREE.CylinderGeometry(0.06, 0.09, 0.25, 5).translate(0, 0.12, 0)];
  for (let i = 0; i < 5; i++) { const s = 1 - i * 0.17; parts.push(new THREE.ConeGeometry(0.32 * s, 0.38, 7).translate(0, 0.2 + i * 0.16, 0)); }
  const pine = mergeGeometries(parts.map((g) => g.toNonIndexed()));
  const mats = [];
  const tree = (x, z, h) => { dummy.position.set(x, 0, z); dummy.rotation.set(0, rand(0, 6.28), 0); dummy.scale.set(h * rand(0.75, 1.1), h, h * 0.9); dummy.updateMatrix(); mats.push(dummy.matrix.clone()); };
  for (let i = 0; i < 700; i++) tree(rand(-520, 520), rand(-262, -250), rand(8, 18));                        // far shore forest
  for (let i = 0; i < 90; i++) { const s = Math.random() < 0.5 ? -1 : 1; tree(s * rand(17, 45), rand(-28, -10), rand(4, 9)); } // framing the meadow
  const m = new THREE.InstancedMesh(pine, new THREE.MeshBasicMaterial({ color: 0x02060b, fog: false }), mats.length);
  mats.forEach((mx, i) => m.setMatrixAt(i, mx));
  scene.add(m);
}

/* ---------- wind: shared vertex sway for every plant ---------- */
function windy(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = uTime;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        mvPosition = instanceMatrix * mvPosition;
        vec3 io = (modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
      #else
        vec3 io = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
      #endif
      mvPosition = modelMatrix * mvPosition;
      float sw = sin(uTime * 1.2 + io.x * 0.55 + io.z * 0.35) + 0.35 * sin(uTime * 2.6 + io.x * 1.9 + io.z);
      float bend = max(mvPosition.y, 0.0); bend *= bend;
      mvPosition.x += sw * bend * 0.09;
      mvPosition.z += sw * bend * 0.04;
      mvPosition = viewMatrix * mvPosition;
      gl_Position = projectionMatrix * mvPosition;`);
  };
  return mat;
}

const UP = new THREE.Vector3(0, 1, 0);
function segment(a, b, r) { // matrix placing a unit cylinder between two points
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  dummy.position.copy(a).addScaledVector(d, 0.5);
  dummy.quaternion.setFromUnitVectors(UP, d.normalize());
  dummy.scale.set(r, len, r); dummy.updateMatrix();
  return dummy.matrix.clone();
}
function instanced(geo, mat, matrices, colors) {
  const m = new THREE.InstancedMesh(geo, mat, matrices.length);
  matrices.forEach((mx, i) => m.setMatrixAt(i, mx));
  if (colors) colors.forEach((c, i) => m.setColorAt(i, c));
  m.layers.set(1);
  scene.add(m); return m;
}

// keep the space around the pets and the camera's sightline clear
function meadowPoint(spread) {
  for (;;) {
    const x = (Math.random() * 2 - 1) * (Math.random() < 0.55 ? 5 : spread);
    const z = 5.2 - Math.pow(Math.random(), 1.25) * 15; // meadow ends at the lake shore (z ≈ -10)
    if (Math.abs(x) < 1.45 && z > 1.7) continue;
    return [x, z];
  }
}

/* ---------- grass ---------- */
{
  const g = new THREE.PlaneGeometry(0.035, 1, 1, 4); g.translate(0, 0.5, 0);
  const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    p.setX(i, p.getX(i) * (1 - y * 0.92)); p.setZ(i, y * y * 0.12);
    const c = new THREE.Color(0x061a10).lerp(new THREE.Color(0x3a8052), y); col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const N = 26000, mats = [], cols = [];
  for (let i = 0; i < N; i++) {
    // grass also fills the foreground; only the spot the pets sit on stays clear
    const x = (Math.random() * 2 - 1) * (Math.random() < 0.6 ? 4 : 16), z = 6.6 - Math.pow(Math.random(), 1.4) * 17;
    if (Math.abs(x) < 1.0 && z > 2.4 && z < 3.7) continue;
    dummy.position.set(x, 0, z); dummy.rotation.set(rand(-0.15, 0.15), rand(0, 6.28), rand(-0.15, 0.15));
    dummy.scale.set(rand(0.8, 1.4), rand(0.14, 0.34), 1); dummy.updateMatrix(); mats.push(dummy.matrix.clone());
    cols.push(new THREE.Color().setHSL(rand(0.28, 0.38), 0.45, rand(0.35, 0.6)));
  }
  instanced(g, windy(new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.9 })), mats, cols);
}

/* ---------- roses ---------- */
function roseHead() {
  const parts = [], N = 17;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), r = 0.03 + 0.08 * t, sy = 1.35 - 0.7 * t;
    const g = new THREE.SphereGeometry(r, 10, 6, -0.8, 1.6, Math.PI / 2, Math.PI / 2); // a curved bowl wedge = one petal
    g.scale(1, sy, 1); g.translate(0, sy * r, 0);
    g.rotateZ(0.12 + 0.55 * t * t);
    g.rotateY(i * 2.39996);
    parts.push(g);
  }
  return mergeGeometries(parts);
}
{
  const heads = [], headCols = [], stems = [], leaves = [];
  for (let i = 0; i < 520; i++) {
    const [x, z] = meadowPoint(13), h = rand(0.32, 0.72);
    const top = new THREE.Vector3(x + rand(-0.04, 0.04), h, z + rand(-0.04, 0.04));
    stems.push(segment(new THREE.Vector3(x, 0, z), top, 1));
    dummy.position.copy(top); dummy.rotation.set(rand(-0.35, 0.35), rand(0, 6.28), rand(-0.35, 0.35));
    dummy.scale.setScalar(rand(0.85, 1.45)); dummy.updateMatrix(); heads.push(dummy.matrix.clone());
    headCols.push(new THREE.Color().setHSL(rand(0.96, 1.0), rand(0.75, 0.9), rand(0.28, 0.42)));
    for (const f of [0.38, 0.62]) {
      dummy.position.set(x, h * f, z); dummy.rotation.set(0, rand(0, 6.28), rand(0.3, 0.7));
      dummy.scale.setScalar(rand(0.8, 1.2)); dummy.updateMatrix(); leaves.push(dummy.matrix.clone());
    }
  }
  instanced(roseHead(), windy(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, side: THREE.DoubleSide, emissive: 0x40000c, emissiveIntensity: 0.6 })), heads, headCols);
  instanced(new THREE.CylinderGeometry(0.009, 0.011, 1, 5, 1, true), windy(new THREE.MeshStandardMaterial({ color: 0x2c6a35, roughness: 0.8 })), stems);
  const leaf = new THREE.SphereGeometry(1, 10, 6); leaf.scale(0.05, 0.006, 0.022); leaf.translate(0.05, 0, 0);
  instanced(leaf, windy(new THREE.MeshStandardMaterial({ color: 0x2f7a3e, roughness: 0.7 })), leaves);
}

/* ---------- baby's breath (gypsophila) ---------- */
{
  const stems = [], florets = [];
  for (let i = 0; i < 380; i++) {
    const [x, z] = meadowPoint(13), h = rand(0.38, 0.7);
    const base = new THREE.Vector3(x, 0, z), fork = new THREE.Vector3(x, h * 0.65, z);
    stems.push(segment(base, fork, 0.6));
    for (let b = 0; b < 6; b++) {
      const tip = new THREE.Vector3(x + rand(-0.14, 0.14), h + rand(-0.04, 0.1), z + rand(-0.14, 0.14));
      stems.push(segment(fork, tip, 0.35));
      for (let f = 0; f < 7; f++) {
        dummy.position.set(tip.x + rand(-0.045, 0.045), tip.y + rand(-0.02, 0.04), tip.z + rand(-0.045, 0.045));
        dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(rand(0.7, 1.3)); dummy.updateMatrix(); florets.push(dummy.matrix.clone());
      }
    }
  }
  instanced(new THREE.CylinderGeometry(0.01, 0.01, 1, 4, 1, true), windy(new THREE.MeshStandardMaterial({ color: 0x5a8a5c, roughness: 0.8 })), stems);
  instanced(new THREE.IcosahedronGeometry(0.013, 1), windy(new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xdfe6ff, emissiveIntensity: 0.55, roughness: 0.6 })), florets);
}

/* ---------- characters ---------- */
const fur = (color, sheenColor, roughness = 0.75) => new THREE.MeshPhysicalMaterial({ color, roughness, sheen: 1, sheenColor, sheenRoughness: 0.45 });
const ellipsoid = (mat, r, sx, sy, sz, x, y, z) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28), mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); return m; };
const lathe = (pts, mat) => new THREE.Mesh(new THREE.LatheGeometry(pts.map(([a, b]) => new THREE.Vector2(a, b)), 48), mat);

function makeDog() {
  const dog = new THREE.Group();
  const coat = fur(0xe8ad5c, 0xffe6b0), cream = fur(0xf6d39a, 0xfff3d6), dark = fur(0xc07a36, 0xf0c07a), black = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
  const body = lathe([[0, 0], [0.3, 0.02], [0.39, 0.12], [0.41, 0.28], [0.37, 0.46], [0.3, 0.62], [0.23, 0.74], [0.18, 0.82], [0, 0.87]], coat);
  body.scale.set(1, 1, 0.9); body.rotation.x = -0.12; dog.add(body);
  dog.add(ellipsoid(coat, 0.2, 0.95, 0.78, 1.35, 0.27, 0.15, 0.02), ellipsoid(coat, 0.2, 0.95, 0.78, 1.35, -0.27, 0.15, 0.02));
  dog.add(ellipsoid(cream, 0.1, 0.9, 0.5, 1.4, 0.28, 0.04, -0.22), ellipsoid(cream, 0.1, 0.9, 0.5, 1.4, -0.28, 0.04, -0.22));
  dog.add(ellipsoid(cream, 0.08, 0.9, 0.6, 1.3, 0.13, 0.04, -0.34), ellipsoid(cream, 0.08, 0.9, 0.6, 1.3, -0.13, 0.04, -0.34));
  dog.add(ellipsoid(coat, 0.21, 1.05, 0.9, 1, 0, 0.82, -0.07)); // ruff / neck

  const head = new THREE.Group(); head.position.set(0, 0.86, -0.08); head.rotation.set(0.38, 0, -0.2); dog.add(head);
  head.add(ellipsoid(coat, 0.215, 1, 0.95, 1.05, 0, 0.17, -0.04));
  const muzzle = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.13, 8, 20), cream); muzzle.rotation.x = Math.PI / 2; muzzle.position.set(0, 0.1, -0.27); head.add(muzzle);
  head.add(ellipsoid(black, 0.036, 1.2, 0.9, 1, 0, 0.13, -0.41));
  for (const s of [1, -1]) {
    const ear = ellipsoid(dark, 1, 0.055, 0.16, 0.11, s * 0.2, 0.12, -0.02); ear.rotation.z = s * 0.28; head.add(ear);
  }

  const tail = new THREE.Group(); tail.position.set(0, 0.1, 0.3); dog.add(tail);
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(-0.18, -0.05, 0.2), new THREE.Vector3(-0.45, -0.07, 0.28), new THREE.Vector3(-0.68, -0.04, 0.22)]);
  for (let i = 0; i <= 28; i++) { // dense overlap so the feathered tail reads as one shape
    const t = i / 28, p = curve.getPoint(t);
    tail.add(ellipsoid(t > 0.6 ? cream : coat, 0.07 - 0.03 * t, 1.3, 0.8, 1.3, p.x, p.y, p.z));
  }
  dog.userData = { head, tail };
  return dog;
}

function makeCat() {
  const cat = new THREE.Group();
  const coat = fur(0xffffff, 0xfff6ee, 0.7), pink = new THREE.MeshStandardMaterial({ color: 0xf2a7b8, roughness: 0.6 });
  const body = lathe([[0, 0], [0.22, 0.02], [0.28, 0.1], [0.28, 0.22], [0.24, 0.36], [0.18, 0.48], [0.13, 0.56], [0, 0.6]], coat);
  body.scale.set(1, 1, 0.9); cat.add(body);
  cat.add(ellipsoid(coat, 0.14, 1, 0.8, 1.3, 0.18, 0.1, 0.02), ellipsoid(coat, 0.14, 1, 0.8, 1.3, -0.18, 0.1, 0.02));
  cat.add(ellipsoid(coat, 0.06, 0.9, 0.55, 1.4, 0.09, 0.03, -0.24), ellipsoid(coat, 0.06, 0.9, 0.55, 1.4, -0.09, 0.03, -0.24));

  const head = new THREE.Group(); head.position.set(0, 0.58, -0.04); head.rotation.set(0.42, 0, 0.22); cat.add(head);
  head.add(ellipsoid(coat, 0.155, 1.12, 0.95, 1, 0, 0.12, 0));
  head.add(ellipsoid(coat, 0.07, 1.2, 0.8, 1, 0, 0.07, -0.12)); // muzzle
  for (const s of [1, -1]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.058, 0.13, 24), coat); ear.position.set(s * 0.095, 0.27, 0); ear.rotation.z = -s * 0.32; head.add(ear);
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.036, 0.09, 24), pink); inner.position.set(s * 0.093, 0.255, -0.022); inner.rotation.z = -s * 0.32; head.add(inner);
  }

  const tail = new THREE.Group(); tail.position.set(0.05, 0.04, 0.2); cat.add(tail);
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.18, -0.01, 0.1), new THREE.Vector3(0.33, 0, -0.02), new THREE.Vector3(0.36, 0.02, -0.2), new THREE.Vector3(0.3, 0.06, -0.3)]);
  tail.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.035, 14), coat));
  tail.add(ellipsoid(coat, 0.035, 1, 1, 1, 0.3, 0.06, -0.3));
  cat.userData = { head, tail };
  return cat;
}

const dog = makeDog(); dog.position.set(-0.42, 0, 3.0); dog.rotation.y = 0.08; scene.add(dog);
const cat = makeCat(); cat.position.set(0.4, 0, 3.05); cat.rotation.y = -0.1; scene.add(cat);

// soft contact shadow under the pair
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const s = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.3), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  s.rotation.x = -Math.PI / 2; s.position.set(0, 0.01, 3.05); scene.add(s);
}

/* ---------- floating heart ---------- */
const heart = (() => {
  const s = new THREE.Shape();
  s.moveTo(0, 0.25); s.bezierCurveTo(0, 0.25, -0.05, 0, -0.25, 0); s.bezierCurveTo(-0.55, 0, -0.55, 0.35, -0.55, 0.35);
  s.bezierCurveTo(-0.55, 0.55, -0.35, 0.77, 0, 0.95); s.bezierCurveTo(0.35, 0.77, 0.55, 0.55, 0.55, 0.35);
  s.bezierCurveTo(0.55, 0.35, 0.55, 0, 0.25, 0); s.bezierCurveTo(0.1, 0, 0, 0.25, 0, 0.25);
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.18, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 6 });
  g.center(); g.rotateZ(Math.PI);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xff3d6e, emissive: 0xff2a60, emissiveIntensity: 2.2, transparent: true }));
  m.scale.setScalar(0.11); scene.add(m); return m;
})();

/* ---------- fireflies ---------- */
{
  const N = 160, pos = new Float32Array(N * 3), ph = new Float32Array(N);
  for (let i = 0; i < N; i++) { pos.set([rand(-9, 9), rand(0.2, 2.6), rand(-16, 5.5)], i * 3); ph[i] = Math.random() * 6.28; }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('phase', new THREE.BufferAttribute(ph, 1));
  scene.add(new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime, uPR: { value: DPR } },
    vertexShader: `attribute float phase; uniform float uTime, uPR; varying float vA;
      void main(){ vec3 p = position;
        p.x += sin(uTime * 0.35 + phase * 3.0) * 0.6; p.y += sin(uTime * 0.5 + phase) * 0.35; p.z += cos(uTime * 0.3 + phase * 2.0) * 0.6;
        vA = pow(0.5 + 0.5 * sin(uTime * 1.6 + phase * 5.0), 3.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = 70.0 * uPR / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); float a = exp(-d * d * 28.0);
        gl_FragColor = vec4(vec3(1.0, 0.85, 0.45) * a * vA * 1.8, 1.0); }`
  })));
}

/* ---------- post-processing ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.5, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = innerWidth, h = innerHeight, portrait = h > w;
  camera.aspect = w / h; camera.fov = portrait ? 74 : 58;
  camBase.set(0, portrait ? 1.0 : 0.95, portrait ? 7.6 : 7.0);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false); composer.setSize(w, h);
}
addEventListener('resize', resize); resize();

// gentle parallax following pointer / finger
const look = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener('pointermove', (e) => { look.tx = e.clientX / innerWidth - 0.5; look.ty = e.clientY / innerHeight - 0.5; });

const clock = new THREE.Clock();
const speed = reduceMotion ? 0.25 : 1;
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime() * speed;
  uTime.value = t;
  look.x += (look.tx - look.x) * 0.04; look.y += (look.ty - look.y) * 0.04;
  camera.position.set(camBase.x + look.x * 0.9 + Math.sin(t * 0.07) * 0.35, camBase.y - look.y * 0.35 + Math.sin(t * 0.05) * 0.06, camBase.z);
  camera.lookAt(lookTarget);

  dog.userData.tail.rotation.y = Math.sin(t * 7) * 0.35;
  dog.userData.head.rotation.z = -0.2 + Math.sin(t * 0.6) * 0.03;
  cat.userData.tail.rotation.y = Math.sin(t * 1.3) * 0.12;
  cat.userData.head.rotation.z = 0.22 + Math.sin(t * 0.5 + 1) * 0.03;

  const k = (t % 5) / 5; // heart rises between them every 5s
  heart.position.set(0, 1.35 + k * 1.1, 2.85);
  heart.rotation.y = Math.sin(t * 1.5) * 0.5;
  heart.material.opacity = Math.sin(Math.PI * Math.min(k * 1.2, 1));
  heart.scale.setScalar(0.08 + k * 0.05);

  composer.render();
});
requestAnimationFrame(() => canvas.classList.add('ready'));
</script>
